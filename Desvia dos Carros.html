<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desvia dos Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 880px;
            background: #1e293b;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #334155;
        }

        .touch-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 4px 14px 0 rgba(29, 78, 216, 0.5);
            transition: transform 0.08s ease, background-color 0.1s ease;
        }

        .touch-btn:active {
            transform: scale(0.92);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        /* Prevent zooming on double tap */
        button {
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div id="game-container" class="rounded-none sm:rounded-2xl border-0 sm:border-4 border-slate-700">
        
        <!-- HUD Overlay -->
        <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-10 bg-gradient-to-b from-slate-900/80 to-transparent pointer-events-none">
            <div class="flex flex-col">
                <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Pontuação</span>
                <span id="score-text" class="text-3xl font-extrabold text-amber-400 font-mono drop-shadow-md">0</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Recorde</span>
                <span id="high-score-text" class="text-xl font-bold text-emerald-400 font-mono">0</span>
            </div>
        </div>

        <!-- Canvas Game Screen -->
        <div class="relative flex-1 w-full h-full overflow-hidden">
            <canvas id="gameCanvas"></canvas>

            <!-- Start Screen Overlay -->
            <div id="start-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col justify-center items-center p-6 text-center z-20">
                <div class="w-16 h-16 mb-3 rounded-2xl bg-amber-500/20 flex items-center justify-center border border-amber-500/40 shadow-lg">
                    <svg class="w-10 h-10 text-amber-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4h14v4z"/>
                        <circle cx="7.5" cy="15" r="1.5"/>
                        <circle cx="16.5" cy="15" r="1.5"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-black tracking-wider text-white mb-1 uppercase">Desvia dos Carros</h1>
                <p class="text-slate-400 text-sm mb-6 max-w-xs">Toque na esquerda ou direita para desviá-los e bater o recorde!</p>
                
                <div class="mb-6 bg-slate-900/80 rounded-xl p-3 border border-slate-800 w-full max-w-xs">
                    <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Seu Melhor Resultado</div>
                    <div id="start-high-score" class="text-2xl font-bold text-emerald-400 font-mono">0 pts</div>
                </div>

                <button id="btn-start" class="w-full max-w-xs py-4 px-8 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl rounded-xl shadow-lg shadow-amber-500/30 transform active:scale-95 transition-all uppercase tracking-wider">
                    JOGAR
                </button>
            </div>

            <!-- Game Over Screen Overlay -->
            <div id="gameover-screen" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center z-20">
                <div class="w-16 h-16 mb-2 rounded-full bg-red-500/20 flex items-center justify-center border border-red-500/40 animate-bounce">
                    <span class="text-3xl">💥</span>
                </div>
                <h2 class="text-3xl font-black text-red-500 mb-1 uppercase tracking-wide">FIM DE JOGO!</h2>
                <p id="new-record-tag" class="hidden text-amber-400 font-bold text-xs bg-amber-500/20 px-3 py-1 rounded-full border border-amber-500/30 mb-4 animate-pulse">
                    🏆 NOVO RECORDE!
                </p>

                <div class="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 w-full max-w-xs mb-6 space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-sm text-slate-400">Pontuação Final:</span>
                        <span id="final-score" class="text-2xl font-extrabold text-amber-400 font-mono">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-400">Recorde Atual:</span>
                        <span id="final-high-score" class="text-lg font-bold text-emerald-400 font-mono">0</span>
                    </div>
                </div>

                <button id="btn-restart" class="w-full max-w-xs py-4 px-8 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl rounded-xl shadow-lg shadow-emerald-500/30 transform active:scale-95 transition-all uppercase tracking-wider">
                    JOGAR NOVAMENTE
                </button>
            </div>
        </div>

        <!-- Touch Controls Bar -->
        <div id="controls" class="p-4 bg-slate-900 border-t border-slate-800 flex gap-4 h-32 select-none">
            <button id="btn-left" class="touch-btn flex-1 rounded-2xl flex items-center justify-center text-white text-4xl font-black active:bg-blue-700">
                ◄
            </button>
            <button id="btn-right" class="touch-btn flex-1 rounded-2xl flex items-center justify-center text-white text-4xl font-black active:bg-blue-700">
                ►
            </button>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer for Arcade Sounds
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCrash() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
                noise.stop(this.ctx.currentTime + 0.3);
            }

            playScore() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.05); // E5
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
        }

        const sound = new SoundFX();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const scoreText = document.getElementById('score-text');
        const highScoreText = document.getElementById('high-score-text');
        const startHighScoreText = document.getElementById('start-high-score');
        const finalScoreText = document.getElementById('final-score');
        const finalHighScoreText = document.getElementById('final-high-score');
        const newRecordTag = document.getElementById('new-record-tag');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // Game State Variables
        let isPlaying = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('desvia_carros_highscore')) || 0;
        let animationFrameId = null;
        let lastTime = 0;
        let roadOffset = 0;

        // Dynamic Speed Control
        let baseSpeed = 5;
        let currentSpeed = baseSpeed;
        const maxSpeed = 16;
        const speedAcceleration = 0.0015;

        // Lane setup (3 Lanes)
        const NUM_LANES = 3;
        let laneWidth = 0;
        let laneCenters = [0, 0, 0];

        // Player Car
        const player = {
            width: 44,
            height: 76,
            x: 0,
            y: 0,
            targetLane: 1, // 0: Left, 1: Center, 2: Right
            currentLane: 1,
            color: '#ef4444', // Red
            moveSpeed: 12
        };

        // Enemy Cars Array
        let enemies = [];
        let particles = [];
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 90; // frames

        // Control States
        let moveLeftPressed = false;
        let moveRightPressed = false;

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            // Recalculate lane dimensions
            laneWidth = canvas.width / NUM_LANES;
            for (let i = 0; i < NUM_LANES; i++) {
                laneCenters[i] = (i * laneWidth) + (laneWidth / 2);
            }

            // Adjust car dimensions relative to screen size
            player.width = Math.min(Math.max(canvas.width * 0.18, 36), 52);
            player.height = player.width * 1.8;
            player.y = canvas.height - player.height - 30;

            if (!isPlaying) {
                player.x = laneCenters[1] - (player.width / 2);
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // Input Handling
        function setMoveLeft(active) {
            moveLeftPressed = active;
            if (active && isPlaying) sound.init();
        }

        function setMoveRight(active) {
            moveRightPressed = active;
            if (active && isPlaying) sound.init();
        }

        // Touch Control Listeners
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); setMoveLeft(true); }, { passive: false });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); setMoveLeft(false); }, { passive: false });
        btnLeft.addEventListener('mousedown', () => setMoveLeft(true));
        btnLeft.addEventListener('mouseup', () => setMoveLeft(false));
        btnLeft.addEventListener('mouseleave', () => setMoveLeft(false));

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); setMoveRight(true); }, { passive: false });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); setMoveRight(false); }, { passive: false });
        btnRight.addEventListener('mousedown', () => setMoveRight(true));
        btnRight.addEventListener('mouseup', () => setMoveRight(false));
        btnRight.addEventListener('mouseleave', () => setMoveRight(false));

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setMoveLeft(true);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setMoveRight(true);
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setMoveLeft(false);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setMoveRight(false);
        });

        // Initialize UI display
        function updateScoreDisplay() {
            scoreText.textContent = Math.floor(score);
            highScoreText.textContent = highScore;
            startHighScoreText.textContent = `${highScore} pts`;
        }

        function startGame() {
            sound.init();
            sound.playClick();

            isPlaying = true;
            score = 0;
            currentSpeed = baseSpeed;
            enemies = [];
            particles = [];
            enemySpawnTimer = 0;

            resizeCanvas();
            player.x = laneCenters[1] - (player.width / 2);

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            newRecordTag.classList.add('hidden');

            updateScoreDisplay();

            lastTime = performance.now();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isPlaying = false;
            sound.playCrash();

            // Create explosion particles
            createExplosion(player.x + player.width / 2, player.y + player.height / 2);

            const isNewRecord = score > highScore;
            if (isNewRecord) {
                highScore = Math.floor(score);
                localStorage.setItem('desvia_carros_highscore', highScore);
                newRecordTag.classList.remove('hidden');
            }

            finalScoreText.textContent = Math.floor(score);
            finalHighScoreText.textContent = highScore;
            updateScoreDisplay();

            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
            }, 600);
        }

        btnStart.addEventListener('click', startGame);
        btnRestart.addEventListener('click', startGame);

        const ENEMY_COLORS = ['#38bdf8', '#a855f7', '#eab308', '#22c55e', '#ec4899'];

        function spawnEnemy() {
            const laneIndex = Math.floor(Math.random() * NUM_LANES);
            const color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
            
            // Avoid spawning if another enemy in same lane is too close to top
            const sameLaneEnemy = enemies.find(e => e.lane === laneIndex && e.y < player.height * 2.5);
            if (sameLaneEnemy) return;

            const width = player.width;
            const height = player.height;

            enemies.push({
                lane: laneIndex,
                x: laneCenters[laneIndex] - (width / 2),
                y: -height - 20,
                width: width,
                height: height,
                color: color,
                speedMultiplier: 0.85 + Math.random() * 0.3
            });
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 35; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 4,
                    color: Math.random() > 0.5 ? '#f97316' : '#ef4444',
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.03
                });
            }
        }

        function checkCollision(rect1, rect2) {
            // Padding for slightly more forgiving hitboxes
            const padX = rect1.width * 0.12;
            const padY = rect1.height * 0.12;

            return (
                rect1.x + padX < rect2.x + rect2.width - padX &&
                rect1.x + rect1.width - padX > rect2.x + padX &&
                rect1.y + padY < rect2.y + rect2.height - padY &&
                rect1.y + rect1.height - padY > rect2.y + padY
            );
        }

        function update(deltaTime) {
            // Smooth Horizontal Player Movement
            const moveSpeed = player.moveSpeed * (canvas.width / 360);
            if (moveLeftPressed) {
                player.x -= moveSpeed;
            }
            if (moveRightPressed) {
                player.x += moveSpeed;
            }

            // Keep player inside road boundaries
            const minX = 8;
            const maxX = canvas.width - player.width - 8;
            player.x = Math.max(minX, Math.min(maxX, player.x));

            // Increase road speed gradually
            currentSpeed = Math.min(maxSpeed, currentSpeed + speedAcceleration);
            roadOffset = (roadOffset + currentSpeed) % 40;

            // Score increases with survival and speed
            score += (currentSpeed * 0.05);
            scoreText.textContent = Math.floor(score);

            // Spawn Enemies
            enemySpawnTimer++;
            const dynamicInterval = Math.max(35, enemySpawnInterval - Math.floor(currentSpeed * 2.5));
            if (enemySpawnTimer >= dynamicInterval) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            // Update Enemy Cars
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.y += currentSpeed * enemy.speedMultiplier;

                // Collision Detection
                if (checkCollision(player, enemy)) {
                    gameOver();
                    return;
                }

                // Remove off-screen enemies and play sound tick
                if (enemy.y > canvas.height + 50) {
                    enemies.splice(i, 1);
                    if (isPlaying) sound.playScore();
                }
            }

            // Update Explosion Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawRoad() {
            // Road background
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road borders (Curbs)
            const curbWidth = 8;
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(0, 0, curbWidth, canvas.height);
            ctx.fillRect(canvas.width - curbWidth, 0, curbWidth, canvas.height);

            // Curb striped pattern
            ctx.fillStyle = '#f8fafc';
            for (let y = -40 + roadOffset; y < canvas.height; y += 40) {
                ctx.fillRect(0, y, curbWidth, 20);
                ctx.fillRect(canvas.width - curbWidth, y, curbWidth, 20);
            }

            // Dashed Lane Dividers
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            ctx.setLineDash([24, 24]);
            ctx.lineDashOffset = -roadOffset * 1.5;

            for (let i = 1; i < NUM_LANES; i++) {
                const x = i * laneWidth;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]); // Reset dash
        }

        function drawCar(car, isPlayer = false) {
            const radius = 8;
            const x = car.x;
            const y = car.y;
            const w = car.width;
            const h = car.height;

            ctx.save();

            // Car Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.roundRect(x + 4, y + 6, w, h, radius);
            ctx.fill();

            // Car Body
            ctx.fillStyle = car.color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fill();

            // Windshield / Cabin
            ctx.fillStyle = '#0f172a';
            const cabinMarginX = w * 0.15;
            const cabinMarginY = h * 0.25;
            ctx.beginPath();
            ctx.roundRect(x + cabinMarginX, y + cabinMarginY, w - (cabinMarginX * 2), h * 0.45, 4);
            ctx.fill();

            // Headlights & Taillights
            if (isPlayer) {
                // Front Headlights (Top)
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(x + 4, y + 2, w * 0.2, 4);
                ctx.fillRect(x + w - 4 - (w * 0.2), y + 2, w * 0.2, 4);

                // Rear Taillights (Bottom)
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(x + 4, y + h - 5, w * 0.25, 3);
                ctx.fillRect(x + w - 4 - (w * 0.25), y + h - 5, w * 0.25, 3);
            } else {
                // Enemy Headlights (Bottom - since moving down)
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(x + 4, y + h - 5, w * 0.2, 4);
                ctx.fillRect(x + w - 4 - (w * 0.2), y + h - 5, w * 0.2, 4);

                // Enemy Rear Taillights (Top)
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(x + 4, y + 2, w * 0.25, 3);
                ctx.fillRect(x + w - 4 - (w * 0.25), y + 2, w * 0.25, 3);
            }

            // Wheels
            ctx.fillStyle = '#020617';
            ctx.fillRect(x - 2, y + h * 0.15, 3, h * 0.2);
            ctx.fillRect(x + w - 1, y + h * 0.15, 3, h * 0.2);
            ctx.fillRect(x - 2, y + h * 0.65, 3, h * 0.2);
            ctx.fillRect(x + w - 1, y + h * 0.65, 3, h * 0.2);

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRoad();

            // Draw Enemies
            enemies.forEach(enemy => drawCar(enemy, false));

            // Draw Player
            drawCar(player, true);

            // Draw Explosion Particles
            drawParticles();
        }

        function gameLoop(time) {
            const deltaTime = time - lastTime;
            lastTime = time;

            if (isPlaying) {
                update(deltaTime);
                render();
                animationFrameId = requestAnimationFrame(gameLoop);
            } else {
                // Keep rendering explosion animation if game over just occurred
                if (particles.length > 0) {
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life -= p.decay;
                        if (p.life <= 0) particles.splice(i, 1);
                    }
                    render();
                    animationFrameId = requestAnimationFrame(gameLoop);
                }
            }
        }

        // Initial setup on load
        resizeCanvas();
        updateScoreDisplay();
        render();
    </script>
</body>
</html>
